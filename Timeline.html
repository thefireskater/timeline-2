<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Timeline</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:        #f0ece2;
    --paper-edge:   #e8e2d3;
    --card:         #fbf8f1;
    --card-2:       #f6f2e6;
    --ink:          #1a1714;
    --ink-2:        #423b30;
    --muted:        #8a8377;
    --muted-2:      #b5ad9d;
    --rule:         #d8d2c4;
    --rule-soft:    #e6e0d0;
    --win:          oklch(0.55 0.07 145);
    --win-soft:     oklch(0.92 0.04 145);
    --win-ink:      oklch(0.38 0.06 145);
    --loss:         oklch(0.55 0.12 28);
    --loss-soft:    oklch(0.92 0.05 28);
    --loss-ink:     oklch(0.42 0.10 28);
    --accent:       oklch(0.55 0.10 240);
    --font-serif:   "Instrument Serif", "Source Serif Pro", Georgia, serif;
    --font-sans:    "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  *,*::before,*::after { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  /* App shell */
  .app{
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .topbar{
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    padding: 22px 40px 18px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
  }
  .brand{
    font-family: var(--font-serif);
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.01em;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink);
    display: inline-block;
    transform: translateY(-3px);
  }
  .brand .meta{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-left: 6px;
    white-space: nowrap;
  }

  .view-switch{
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: 3px;
    background: var(--card);
  }
  .view-switch button{
    appearance: none;
    border: 0;
    background: transparent;
    padding: 7px 16px;
    border-radius: 999px;
    font-family: var(--font-sans);
    font-size: 12px;
    letter-spacing: 0.01em;
    color: var(--ink-2);
    cursor: pointer;
  }
  .view-switch button.is-active{
    background: var(--ink);
    color: var(--paper);
  }
  .view-switch button:hover:not(.is-active){ color: var(--ink); }

  .top-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    align-items: center;
  }

  .pill{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-2);
    padding: 7px 14px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--card);
    cursor: pointer;
    line-height: 1;
    white-space: nowrap;
  }
  .pill:hover{ border-color: var(--ink); color: var(--ink); }
  .pill .k{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    padding: 2px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  .pill.primary{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .pill.primary:hover{ background: #000; }

  /* Stage */
  .stage{
    padding: 28px 40px 80px;
    position: relative;
  }

  /* Range bar */
  .range-bar{
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 22px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
  }
  .range-bar .label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .seg{
    display: inline-flex;
    background: var(--card-2);
    border-radius: 8px;
    padding: 2px;
    border: 1px solid var(--rule);
  }
  .seg button{
    appearance: none;
    border: 0;
    background: transparent;
    padding: 6px 12px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    border-radius: 6px;
  }
  .seg button.is-active{
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }

  .scrim{
    flex: 1;
    text-align: right;
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 18px;
    color: var(--ink-2);
  }
  .scrim .count{
    font-family: var(--font-mono);
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-left: 12px;
  }

  /* Shared event chip styles */
  .chip-win  { --dotc: var(--win);  --softc: var(--win-soft);  --inkc: var(--win-ink); }
  .chip-loss { --dotc: var(--loss); --softc: var(--loss-soft); --inkc: var(--loss-ink); }

  .private-ring{
    box-shadow: 0 0 0 1px var(--paper), 0 0 0 2.5px var(--dotc);
    background: var(--paper);
  }

  /* Cards */
  .card{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 20px;
  }

  /* Buttons / inputs */
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }

  /* Image placeholders */
  .img-placeholder{
    background: var(--card-2);
    background-image:
      repeating-linear-gradient(45deg,
        transparent 0 7px,
        rgba(26,23,20,0.04) 7px 8px);
    border: 1px dashed var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    overflow: hidden;
    position: relative;
  }
  .img-placeholder.has-image{
    background: transparent;
    background-image: none;
    border: 0;
  }
  .img-placeholder img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Modal */
  .modal-back{
    position: fixed; inset: 0;
    background: rgba(26,23,20,0.32);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 40px;
    animation: fade 180ms ease-out;
  }
  .modal{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 20px;
    width: 560px;
    max-width: 100%;
    box-shadow: 0 30px 80px rgba(20,15,8,0.18);
    overflow: hidden;
    animation: rise 220ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes fade { from{opacity:0;} to{opacity:1;} }
  @keyframes rise { from{ opacity:0; transform: translateY(8px) scale(0.98);} to{ opacity:1; transform: none;} }

  .modal h2{
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .modal .lead{
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--muted);
    font-size: 16px;
    margin-top: 6px;
  }
  .modal-body{ padding: 24px 28px; }
  .modal-foot{
    padding: 14px 20px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-2);
  }

  .field{ display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .field > label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input[type=text], .field input[type=date], .field textarea{
    appearance: none;
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    padding: 8px 0;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 140ms;
  }
  .field input[type=text]:focus, .field input[type=date]:focus, .field textarea:focus{
    border-bottom-color: var(--ink);
  }
  .field textarea{ resize: vertical; min-height: 70px; line-height: 1.5; }

  .kind-pick, .priv-pick{
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card-2);
  }
  .kind-pick button, .priv-pick button{
    appearance: none;
    border: 0;
    background: transparent;
    padding: 9px 14px;
    font-size: 12.5px;
    color: var(--ink-2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border-right: 1px solid var(--rule);
  }
  .kind-pick button:last-child, .priv-pick button:last-child{ border-right: 0; }
  .kind-pick button.is-active, .priv-pick button.is-active{
    background: var(--paper);
    color: var(--ink);
  }
  .kind-pick .swatch{ width: 10px; height: 10px; border-radius: 50%; background: var(--swatch, var(--ink)); }

  .person-grid{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .person-tile{
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--card-2);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    display: grid;
    gap: 4px;
  }
  .person-tile .av{
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--tint, var(--ink));
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 9px;
    margin: 0 auto;
    display: grid; place-items: center;
  }
  .person-tile .name{
    font-size: 12px; color: var(--ink-2);
  }
  .person-tile.is-active{
    background: var(--paper);
    border-color: var(--ink);
  }

  /* People strip */
  .people-strip{
    display: flex;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
  }
  .person-chip{
    display: inline-flex;
    gap: 8px;
    align-items: center;
    padding: 5px 12px 5px 5px;
    border: 1px solid var(--rule);
    border-radius: 999px;
    background: var(--card-2);
    cursor: pointer;
    font-size: 12px;
    color: var(--ink-2);
  }
  .person-chip.is-off{
    opacity: 0.42;
    text-decoration: line-through;
  }
  .person-chip .av{
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--tint);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 8.5px;
    display: grid; place-items: center;
  }

  /* Utility */
  .hr{ height: 1px; background: var(--rule); width: 100%; }
  .small-caps{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .mono { font-family: var(--font-mono); }
  .serif { font-family: var(--font-serif); }
  .italic { font-style: italic; }
</style>
</head>

<script type="text/babel">
// ── Shared helpers & components ───────────────────────────────────────────────
const { useState, useEffect, useMemo, useRef, useCallback, Fragment } = React;

const MS_DAY = 86400000;
const parseDate = (s) => {
  if (s instanceof Date) return s;
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d, 12, 0, 0);
};
const fmtMonth = (d) => d.toLocaleString('en-US', { month: 'short' });
const fmtMonthLong = (d) => d.toLocaleString('en-US', { month: 'long' });
const fmtDay = (d) => d.getDate();
const fmtFull = (d) => d.toLocaleString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
const fmtFullShort = (d) => d.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const isoDate = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
};
const daysBetween = (a, b) => Math.round((b - a) / MS_DAY);

function getRange(rangeKey, anchor) {
  const end = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate(), 23, 59, 59);
  const start = new Date(end);
  if (rangeKey === 'month')   start.setMonth(start.getMonth() - 1);
  if (rangeKey === 'quarter') start.setMonth(start.getMonth() - 3);
  if (rangeKey === 'year')    start.setFullYear(start.getFullYear() - 1);
  if (rangeKey === 'all')     { start.setFullYear(2025, 5, 1); }
  start.setHours(0, 0, 0, 0);
  return { start, end };
}

const personById = (id) => window.PEOPLE.find(p => p.id === id) || window.PEOPLE[0];

function filterEvents(events, { start, end }, visiblePeople, showPrivate) {
  return events.filter(e => {
    const d = parseDate(e.date);
    if (d < start || d > end) return false;
    if (!visiblePeople[e.person]) return false;
    if (!showPrivate && e.privacy === 'private') return false;
    return true;
  });
}

function clusterEvents(events, tolDays) {
  if (events.length === 0) return [];
  const out = [];
  let cur = null;
  for (const ev of events) {
    const d = parseDate(ev.date);
    if (!cur || daysBetween(parseDate(cur.events[0].date), d) > tolDays) {
      cur = { date: d, events: [ev] };
      out.push(cur);
    } else {
      cur.events.push(ev);
    }
  }
  return out;
}

function Avatar({ person, size=22, ring=false }){
  const p = typeof person === 'string' ? personById(person) : person;
  const s = { width: size, height: size, fontSize: Math.max(8, size*0.38), background: p.tint };
  return (
    <span className={"av" + (ring ? " av-ring" : "")} style={s}>
      <style>{`.av{display:inline-grid;place-items:center;border-radius:50%;color:#f7f3e8;font-family:var(--font-mono);letter-spacing:0.02em;line-height:1;flex:none}.av-ring{box-shadow:0 0 0 2px var(--paper)}`}</style>
      {p.short}
    </span>
  );
}

function PrivacyIcon({ privacy, size=12 }){
  if (privacy === 'public') return (
    <svg width={size} height={size} viewBox="0 0 12 12" aria-label="public">
      <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" strokeWidth="1.1" />
      <circle cx="6" cy="6" r="1.6" fill="currentColor" />
    </svg>
  );
  if (privacy === 'shared') return (
    <svg width={size} height={size} viewBox="0 0 12 12" aria-label="shared">
      <circle cx="4.5" cy="6" r="2.6" fill="none" stroke="currentColor" strokeWidth="1.1" />
      <circle cx="8" cy="6" r="2.6" fill="none" stroke="currentColor" strokeWidth="1.1" />
    </svg>
  );
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" aria-label="private">
      <circle cx="6" cy="6" r="4" fill="none" stroke="currentColor" strokeWidth="1.1" strokeDasharray="1.6 1.4" />
    </svg>
  );
}

function PrivacyLabel({ privacy }){
  const txt = privacy === 'public' ? 'Public'
            : privacy === 'shared' ? 'Shared'
            : 'Private';
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:6,fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--muted)'}}>
      <PrivacyIcon privacy={privacy} /> {txt}
    </span>
  );
}

function KindDot({ event, size=10 }){
  const cls = event.kind === 'win' ? 'chip-win' : 'chip-loss';
  const style = {
    width: size, height: size, borderRadius: '50%',
    background: 'var(--dotc)',
    display: 'inline-block',
    flex: 'none',
  };
  if (event.privacy === 'private') {
    Object.assign(style, {
      background: 'var(--paper)',
      boxShadow: `inset 0 0 0 1.4px var(--dotc)`,
    });
  } else if (event.privacy === 'shared') {
    style.background = `linear-gradient(90deg, var(--dotc) 50%, var(--softc) 50%)`;
  }
  return <span className={cls} style={style} />;
}

function EventImagePlaceholder({ event, height='180px', radius=10, style: extraStyle }){
  if (!event.image) return null;
  return (
    <div className="img-placeholder" style={{ height, borderRadius: radius, ...extraStyle }}>
      {event.imageCaption || 'Drop an image'}
    </div>
  );
}

function PhotoHint({ size=11, color='var(--muted)' }){
  return (
    <svg width={size} height={size} viewBox="0 0 12 12" aria-label="photo" style={{flex:'none', color}}>
      <rect x="1.25" y="2.5" width="9.5" height="7.5" rx="1.2" fill="none" stroke="currentColor" strokeWidth="0.9"/>
      <circle cx="4" cy="5.4" r="0.8" fill="currentColor"/>
      <path d="M2 9 L5 6.5 L7 8 L10 5.5 L10.75 5.5 L10.75 10 L1.25 10 Z" fill="currentColor" opacity="0.7"/>
    </svg>
  );
}


// ── Horizontal View ───────────────────────────────────────────────────────────

function HorizontalView({ events, range, onOpenEvent }){
  const { start, end } = range;
  const hostRef = useRef(null);
  const [w, setW] = useState(1280);
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!hostRef.current) return;
    const ro = new ResizeObserver(entries => {
      for (const e of entries) setW(e.contentRect.width);
    });
    ro.observe(hostRef.current);
    return () => ro.disconnect();
  }, []);

  const totalDays = Math.max(1, daysBetween(start, end));

  const months = useMemo(() => {
    const out = [];
    const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
    while (cursor <= end) {
      out.push(new Date(cursor));
      cursor.setMonth(cursor.getMonth()+1);
    }
    return out;
  }, [start.getTime(), end.getTime()]);

  const padX = 60;
  const padRight = 130;
  const xFor = (d) => {
    const t = (d - start) / (end - start);
    return Math.max(0, Math.min(1, t)) * (w - padX - padRight) + padX;
  };

  const sorted = useMemo(() => [...events].sort((a,b) => parseDate(a.date) - parseDate(b.date)), [events]);
  const wins   = sorted.filter(e => e.kind === 'win');
  const losses = sorted.filter(e => e.kind === 'loss');

  const tolDays = Math.max(2, Math.round(totalDays * 28 / Math.max(600, w)));
  const winClusters  = clusterEvents(wins, tolDays);
  const lossClusters = clusterEvents(losses, tolDays);

  const axisY = 240;
  const totalH = 480;

  return (
    <div className="h-view" ref={hostRef}>
      <style>{`
        .h-view{ position:relative; height:${totalH}px; user-select:none; }
        .h-axis{ position:absolute; left:${padX}px; right:${padX}px; top:${axisY}px; height:1px; background:var(--ink); opacity:0.85; }
        .h-tick{ position:absolute; top:${axisY-5}px; width:1px; height:10px; background:var(--ink); opacity:0.35; }
        .h-tick.major{ height:18px; top:${axisY-9}px; opacity:0.7; }
        .h-month-lbl{
          position:absolute; top:${axisY+14}px; transform:translateX(-50%);
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--muted); white-space: nowrap;
        }
        .h-year-lbl{
          position:absolute; top:${axisY+34}px; transform:translateX(-50%);
          font-family: var(--font-serif); font-style: italic; font-size: 15px; color: var(--ink-2);
        }
        .h-zone-lbl{
          position: absolute; left: 0;
          font-family: var(--font-serif); font-style: italic; color: var(--ink-2); font-size: 15px;
        }
        .h-cluster{
          position:absolute; transform: translateX(-50%);
          display: flex; align-items: center; flex-direction: column; width: 22px;
        }
        .h-cluster.above{ bottom: ${totalH - axisY}px; justify-content: flex-end; flex-direction: column-reverse; }
        .h-cluster.below{ top: ${axisY + 1}px; }
        .h-stem{ width:1px; flex: none; background: var(--rule); }
        .h-stack{ display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .h-cluster.above .h-stack{ flex-direction: column-reverse; }
        .h-dot{
          width: 14px; height: 14px; border-radius: 50%; background: var(--dotc);
          border: 1.5px solid var(--paper); cursor: pointer; transition: transform 140ms;
        }
        .h-dot:hover{ transform: scale(1.3); }
        .h-dot.private{ background: var(--paper); box-shadow: inset 0 0 0 2px var(--dotc); }
        .h-dot.shared{ background: linear-gradient(135deg, var(--dotc) 50%, var(--softc) 50%); }
        .h-label{
          position: absolute; font-family: var(--font-serif); font-size: 14.5px;
          line-height: 1.2; color: var(--ink-2); white-space: nowrap;
          transform-origin: left bottom; transform: rotate(-42deg);
          padding-left: 2px; letter-spacing: -0.005em;
        }
        .h-label.below{ transform-origin: left top; transform: rotate(42deg); }
        .h-label .ttl{ color: var(--ink); }
        .h-label .more{
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
          color: var(--muted); text-transform: uppercase; margin-left: 6px;
        }
        .h-popover{
          position:absolute; transform: translateX(-50%); width: 260px;
          padding: 14px 14px 12px; background: var(--card); border: 1px solid var(--ink);
          border-radius: 12px; box-shadow: 0 20px 50px rgba(20,15,8,0.18); z-index: 20;
        }
        .h-popover .row{
          display: flex; gap: 10px; padding: 8px 0; align-items: flex-start;
          cursor: pointer; border-top: 1px dashed var(--rule);
        }
        .h-popover .row:first-of-type{ border-top: 0; padding-top: 4px; }
        .h-popover .row:hover .ttl{ text-decoration: underline; text-underline-offset: 3px; }
        .h-popover .row .ttl{
          font-family: var(--font-serif); font-size: 15px; line-height: 1.2;
          color: var(--ink); letter-spacing:-0.005em;
        }
        .h-popover .row .meta{
          font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--muted); margin-top: 3px;
          display:flex; gap:8px; align-items:center;
        }
        .h-popover .hd{
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
        }
        .h-leg{
          position: absolute; right: ${padX}px; top: 4px;
          display: flex; gap: 14px; align-items: center;
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--muted);
        }
        .h-leg .swatch{ width:9px; height:9px; border-radius:50%; }
        .h-today{
          position:absolute; top: ${axisY-12}px; bottom: 80px;
          width: 0; border-left: 1px dashed var(--ink); opacity: 0.32;
        }
        .h-today-lbl{
          position:absolute; top: ${axisY-30}px; transform: translateX(-50%);
          font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em;
          text-transform: uppercase; color: var(--ink-2); background: var(--paper);
          padding: 2px 7px; border: 1px solid var(--rule); border-radius: 4px; white-space: nowrap;
        }
      `}</style>

      <div className="h-zone-lbl" style={{ top: 18, left: padX-32 }}>wins</div>
      <div className="h-zone-lbl" style={{ top: axisY + 72, left: padX-32 }}>losses</div>

      <div className="h-leg">
        <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span className="swatch" style={{background:'var(--win)'}}/>win</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span className="swatch" style={{background:'var(--loss)'}}/>loss</span>
        <span style={{display:'inline-flex',alignItems:'center',gap:6}}><span className="swatch" style={{background:'var(--paper)',border:'1.5px solid var(--ink)'}}/>private</span>
      </div>

      <div className="h-axis" />

      {months.map((m, i) => {
        const x = xFor(m);
        const isJan = m.getMonth() === 0;
        return (
          <div key={"m"+i} style={{display:'contents'}}>
            <div className={"h-tick" + (isJan ? " major" : "")} style={{ left: x }} />
            <div className="h-month-lbl" style={{ left: x }}>{fmtMonth(m)}</div>
            {isJan ? <div className="h-year-lbl" style={{ left: x }}>{m.getFullYear()}</div> : null}
          </div>
        );
      })}

      {(() => {
        const today = window.TODAY;
        if (today < start || today > end) return null;
        const x = xFor(today);
        return <>
          <div className="h-today" style={{ left: x }} />
          <div className="h-today-lbl" style={{ left: x }}>today</div>
        </>;
      })()}

      {winClusters.map((cl, i) => {
        const x = xFor(cl.date);
        const id = "w"+i;
        const cls = "chip-win";
        return (
          <div key={id} className={"h-cluster above " + cls}
            style={{ left:x }}
            onMouseEnter={() => setHover({ id, side:'above' })}
            onMouseLeave={() => setHover(h => h && h.id === id ? null : h)}
          >
            <div className="h-stack">
              {cl.events.map(ev => (
                <div key={ev.id}
                  className={"h-dot " + (ev.privacy === 'private' ? 'private' : ev.privacy === 'shared' ? 'shared' : '') + " " + cls}
                  onClick={() => onOpenEvent(ev)}
                  title={ev.title}
                />
              ))}
            </div>
            <div className="h-stem" style={{ height: 10 + cl.events.length * 4 }} />
            <ClusterLabel cluster={cl} side="above" />
          </div>
        );
      })}

      {lossClusters.map((cl, i) => {
        const x = xFor(cl.date);
        const id = "l"+i;
        const cls = "chip-loss";
        return (
          <div key={id} className={"h-cluster below " + cls}
            style={{ left:x }}
            onMouseEnter={() => setHover({ id, side:'below' })}
            onMouseLeave={() => setHover(h => h && h.id === id ? null : h)}
          >
            <div className="h-stem" style={{ height: 10 + cl.events.length * 4 }} />
            <div className="h-stack">
              {cl.events.map(ev => (
                <div key={ev.id}
                  className={"h-dot " + (ev.privacy === 'private' ? 'private' : ev.privacy === 'shared' ? 'shared' : '') + " " + cls}
                  onClick={() => onOpenEvent(ev)}
                  title={ev.title}
                />
              ))}
            </div>
            <ClusterLabel cluster={cl} side="below" />
          </div>
        );
      })}

      {hover ? (() => {
        const list = hover.side === 'above' ? winClusters : lossClusters;
        const idx = parseInt(hover.id.slice(1), 10);
        const cl = list[idx];
        if (!cl) return null;
        const x = xFor(cl.date);
        const cls = hover.side === 'above' ? 'chip-win' : 'chip-loss';
        return (
          <div className={"h-popover " + cls}
            style={{
              left: x,
              [hover.side === 'above' ? 'bottom' : 'top']: hover.side === 'above' ? (totalH - axisY + 90) : (axisY + 90),
            }}
            onMouseEnter={() => setHover(hover)}
            onMouseLeave={() => setHover(null)}
          >
            <div className="hd">{fmtFull(cl.date)}{cl.events.length > 1 ? ` \u00b7 ${cl.events.length} entries` : ''}</div>
            {cl.events.map(ev => (
              <div key={ev.id} className="row" onClick={() => onOpenEvent(ev)}>
                <KindDot event={ev} size={9} />
                <div style={{flex:1, minWidth:0}}>
                  <div className="ttl">{ev.title}</div>
                  <div className="meta">
                    <Avatar person={ev.person} size={14} />
                    <span>{personById(ev.person).name}</span>
                    <span style={{flex:1}}/>
                    {ev.image ? <PhotoHint size={11} /> : null}
                    <PrivacyIcon privacy={ev.privacy} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      })() : null}
    </div>
  );
}

function ClusterLabel({ cluster, side }){
  const top = cluster.events[0];
  const extra = cluster.events.length - 1;
  const max = 24;
  const text = top.title.length > max ? top.title.slice(0, max-1).trim() + '\u2026' : top.title;
  const style = side === 'above'
    ? { bottom: 6 + cluster.events.length * 18 + 14, left: '50%', transform: 'translateX(-2px) rotate(-42deg)' }
    : { top:    6 + cluster.events.length * 18 + 14, left: '50%', transform: 'translateX(-2px) rotate(42deg)'  };
  return (
    <div className={"h-label " + (side === 'below' ? 'below' : '')} style={style}>
      <span className="ttl">{text}</span>
      {extra > 0 ? <span className="more">+{extra}</span> : null}
    </div>
  );
}


// ── Vertical View ─────────────────────────────────────────────────────────────

function VerticalView({ events, range, onOpenEvent }){
  const sorted = useMemo(() => [...events].sort((a,b) => parseDate(b.date) - parseDate(a.date)), [events]);

  const byMonth = useMemo(() => {
    const m = new Map();
    for (const e of sorted) {
      const d = parseDate(e.date);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!m.has(k)) m.set(k, { key: k, date: new Date(d.getFullYear(), d.getMonth(), 1), events: [] });
      m.get(k).events.push(e);
    }
    return Array.from(m.values());
  }, [sorted]);

  return (
    <div className="v-view">
      <style>{`
        .v-view{ position: relative; max-width: 980px; margin: 0 auto; padding: 10px 0 60px; }
        .v-axis{
          position: absolute; left: 50%; top: 0; bottom: 0;
          width: 1px; background: var(--rule); transform: translateX(-0.5px);
        }
        .v-month{ position: relative; padding: 22px 0 6px; }
        .v-month-hdr{ position: relative; display: grid; place-items: center; margin-bottom: 16px; }
        .v-month-hdr .pill{
          position: relative; z-index: 1; background: var(--paper);
          font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
          text-transform: uppercase; color: var(--ink-2); padding: 6px 14px;
          border: 1px solid var(--rule); border-radius: 999px;
        }
        .v-row{
          display: grid; grid-template-columns: 1fr 80px 1fr;
          align-items: start; gap: 0; margin: 12px 0;
        }
        .v-card{
          background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
          padding: 14px 16px 14px; cursor: pointer;
          transition: transform 160ms, border-color 160ms, box-shadow 160ms; position: relative;
        }
        .v-card:hover{
          border-color: var(--ink); box-shadow: 0 10px 30px rgba(20,15,8,0.06); transform: translateY(-1px);
        }
        .v-card .top{ display: flex; align-items: center; gap: 8px; color: var(--muted); }
        .v-card .ttl{
          font-family: var(--font-serif); font-size: 21px; line-height: 1.15;
          letter-spacing: -0.005em; margin: 4px 0 6px; color: var(--ink);
        }
        .v-card .note{ font-size: 13px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
        .v-card.left  { margin-right: 14px;  border-left: 3px solid var(--dotc); }
        .v-card.right { margin-left: 14px;   border-right: 3px solid var(--dotc); }
        .v-axis-marker{ display: grid; place-items: center; position: relative; }
        .v-axis-marker .day{
          position: absolute; top: 14px; z-index: 2; background: var(--paper);
          font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
          color: var(--muted); padding: 2px 4px; white-space: nowrap;
        }
        .v-axis-marker .dot{
          position: absolute; top: 30px; width: 16px; height: 16px;
          border-radius: 50%; background: var(--dotc); box-shadow: 0 0 0 4px var(--paper);
        }
        .v-axis-marker .dot.private{
          background: var(--paper); box-shadow: 0 0 0 4px var(--paper), inset 0 0 0 2px var(--dotc);
        }
        .v-axis-marker .dot.shared{
          background: linear-gradient(135deg, var(--dotc) 50%, var(--softc) 50%);
        }
      `}</style>

      <div className="v-axis" />

      {byMonth.map(group => (
        <div className="v-month" key={group.key}>
          <div className="v-month-hdr">
            <span className="pill">
              {group.date.toLocaleString('en-US', { month: 'long' })} {group.date.getFullYear()}
            </span>
          </div>

          {group.events.map((ev, i) => {
            const side = i % 2 === 0 ? 'left' : 'right';
            const d = parseDate(ev.date);
            const cls = ev.kind === 'win' ? 'chip-win' : 'chip-loss';
            return (
              <div key={ev.id} className="v-row">
                {side === 'left' ? (
                  <div className={"v-card left " + cls} onClick={() => onOpenEvent(ev)}>
                    <VCardBody ev={ev} d={d} />
                  </div>
                ) : <div />}

                <div className={"v-axis-marker " + cls}>
                  <div className="day">{fmtMonth(d).toUpperCase()} {fmtDay(d)}</div>
                  <div className={"dot " + (ev.privacy === 'private' ? 'private' : ev.privacy === 'shared' ? 'shared' : '')} />
                </div>

                {side === 'right' ? (
                  <div className={"v-card right " + cls} onClick={() => onOpenEvent(ev)}>
                    <VCardBody ev={ev} d={d} />
                  </div>
                ) : <div />}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function VCardBody({ ev, d }){
  return (
    <>
      <div className="top">
        <Avatar person={ev.person} size={18} />
        <span style={{fontFamily:'var(--font-mono)',fontSize:10.5,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--muted)'}}>
          {personById(ev.person).name} &middot; {ev.kind}
        </span>
        <span style={{flex:1}}/>
        <PrivacyIcon privacy={ev.privacy} />
      </div>
      {ev.image ? (
        <div style={{margin:'10px -4px 4px'}}>
          <EventImagePlaceholder event={ev} height="170px" radius={8} />
        </div>

      <div className="ttl">{ev.title}</div>
      {ev.note ? <div className="note">{ev.note}</div> : null}
    </>

}


// ── Grid View ─────────────────────────────────────────────────────────────────

function GridView({ events, range, onOpenEvent }){
  const { start, end } = range;

  const months = useMemo(() => {
    const out = [];
    const cursor = new Date(start.getFullYear(), start.getMonth(), 1);
    const stop = new Date(end.getFullYear(), end.getMonth(), 1);
    while (cursor <= stop) {
      out.push(new Date(cursor));
      cursor.setMonth(cursor.getMonth()+1);
    }
    return out;
  }, [start.getTime(), end.getTime()]);

  const monthMap = useMemo(() => {
    const m = new Map();
    for (const e of events) {
      const d = parseDate(e.date);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(e);
    }
    return m;
  }, [events]);

  const colCount = months.length <= 4 ? months.length : (months.length <= 6 ? 3 : 4);

  return (
    <div className="g-view">
      <style>{`
        .g-view{ display: grid; grid-template-columns: repeat(${colCount}, 1fr); gap: 18px; }
        .g-month{
          background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
          padding: 16px 16px 18px; position: relative;
        }
        .g-mh{ display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
        .g-mh .name{ font-family: var(--font-serif); font-size: 22px; letter-spacing: -0.005em; line-height: 1; }
        .g-mh .yr{ font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); }
        .g-mh .tot{ display: inline-flex; gap: 10px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }
        .g-mh .tot .w{ color: var(--win-ink); }
        .g-mh .tot .l{ color: var(--loss-ink); }
        .g-days{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 4px; }
        .g-dow{
          font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em;
          color: var(--muted-2); text-align: center; padding: 2px 0;
        }
        .g-cell{
          aspect-ratio: 1 / 1; border-radius: 5px; background: var(--card-2);
          position: relative; display: grid; place-items: center;
          font-family: var(--font-mono); font-size: 9.5px; color: var(--muted-2);
          cursor: default; overflow: hidden;
        }
        .g-cell.out{ opacity: 0.25; }
        .g-cell.today{ outline: 1.5px solid var(--ink); outline-offset: -1.5px; color: var(--ink); }
        .g-cell.has{ cursor: pointer; color: var(--ink); }
        .g-cell.has:hover{ transform: scale(1.08); z-index: 3; }
        .g-fill-win  { background: var(--win-soft); }
        .g-fill-loss { background: var(--loss-soft); }
        .g-fill-mixed{ background: linear-gradient(135deg, var(--win-soft) 50%, var(--loss-soft) 50%); }
        .g-dots{
          position: absolute; bottom: 3px; left: 0; right: 0;
          display: flex; justify-content: center; gap: 2px;
        }
        .g-dot{ width: 5px; height: 5px; border-radius: 50%; }
        .g-dot.win{  background: var(--win); }
        .g-dot.loss{ background: var(--loss); }
        .g-dot.private{
          background: var(--paper);
          box-shadow: inset 0 0 0 1px var(--dotc-here, var(--ink));
        }
        .g-num{
          position: absolute; top: 3px; left: 5px;
          font-family: var(--font-mono); font-size: 9px; color: var(--muted-2);
        }
        .g-cell.has .g-num{ color: var(--ink-2); }
        .g-list{
          margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--rule);
          display: flex; flex-direction: column; gap: 6px;
        }
        .g-evt{ display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
        .g-evt .ttl{
          font-size: 12.5px; color: var(--ink-2); line-height: 1.3; flex: 1; text-wrap: pretty;
        }
        .g-evt:hover .ttl{ color: var(--ink); text-decoration: underline; text-decoration-thickness: 0.5px; text-underline-offset: 3px; }
        .g-evt .d{ font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 22px; }
      `}</style>

      {months.map((m, i) => (
        <MonthCard key={i} month={m} events={monthMap.get(`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}`) || []} onOpenEvent={onOpenEvent} />
      ))}
    </div>
  );
}

function MonthCard({ month, events, onOpenEvent }){
  const year = month.getFullYear();
  const mIdx = month.getMonth();
  const daysIn = new Date(year, mIdx+1, 0).getDate();
  const firstDow = new Date(year, mIdx, 1).getDay();
  const lead = (firstDow + 6) % 7;
  const totalCells = Math.ceil((lead + daysIn) / 7) * 7;

  const byDay = {};
  for (const e of events) {
    const d = parseDate(e.date).getDate();
    (byDay[d] ||= []).push(e);
  }

  const wins  = events.filter(e => e.kind === 'win').length;
  const losses = events.filter(e => e.kind === 'loss').length;

  const today = window.TODAY;
  const isThisMonth = today.getFullYear() === year && today.getMonth() === mIdx;

  return (
    <div className="g-month">
      <div className="g-mh">
        <div>
          <div className="name">{fmtMonthLong(month)}</div>
          <div className="yr">{year}</div>
        </div>
        <div className="tot">
          {wins  > 0 ? <span className="w">{wins}W</span>  : null}
          {losses> 0 ? <span className="l">{losses}L</span> : null}
          {wins === 0 && losses === 0 ? <span style={{color:'var(--muted-2)'}}>—</span> : null}
        </div>
      </div>

      <div className="g-days">
        {['M','T','W','T','F','S','S'].map((d,i) => (
          <div key={i} className="g-dow">{d}</div>
        ))}
        {Array.from({length: totalCells}, (_, i) => {
          const dayNum = i - lead + 1;
          if (dayNum < 1 || dayNum > daysIn) {
            return <div key={i} className="g-cell out" />;
          }
          const dayEvents = byDay[dayNum] || [];
          const hasWin = dayEvents.some(e => e.kind === 'win');
          const hasLoss = dayEvents.some(e => e.kind === 'loss');
          let fill = '';
          if (hasWin && hasLoss) fill = 'g-fill-mixed';
          else if (hasWin) fill = 'g-fill-win';
          else if (hasLoss) fill = 'g-fill-loss';

          const isToday = isThisMonth && today.getDate() === dayNum;

          return (
            <div
              key={i}
              className={"g-cell " + fill + (dayEvents.length ? ' has ' : '') + (isToday ? ' today' : '')}
              onClick={dayEvents.length ? () => onOpenEvent(dayEvents[0]) : undefined}
              title={dayEvents.length ? dayEvents.map(e => e.title).join(' \u2022 ') : ''}
            >
              <span className="g-num">{dayNum}</span>
              {dayEvents.length ? (
                <div className="g-dots">
                  {dayEvents.slice(0,4).map((e, j) => {
                    const cls = e.kind === 'win' ? 'win' : 'loss';
                    const priv = e.privacy === 'private';
                    return (
                      <div
                        key={j}
                        className={"g-dot " + cls + (priv ? ' private' : '')}
                        style={priv ? { '--dotc-here': e.kind === 'win' ? 'var(--win)' : 'var(--loss)' } : undefined}
                      />
                    );
                  })}
                </div>
              ) : null}
            </div>
          );
        })}
      </div>

      {events.length > 0 ? (
        <div className="g-list">
          {events
            .slice()
            .sort((a,b) => parseDate(a.date) - parseDate(b.date))
            .map(e => (
              <div key={e.id} className="g-evt" onClick={() => onOpenEvent(e)}>
                <KindDot event={e} size={8} />
                <span className="d">{String(parseDate(e.date).getDate()).padStart(2,'0')}</span>
                <span className="ttl">{e.title}</span>
                {e.image ? <PhotoHint /> : null}
                <Avatar person={e.person} size={16} />
              </div>
            ))}
        </div>
      ) : null}
    </div>
  );
}


// ── Modals ────────────────────────────────────────────────────────────────────

function ModalShell({ onClose, children, width=560 }){
  useEffect(() => {
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, [onClose]);
  return (
    <div className="modal-back" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" style={{ width }} onMouseDown={(e) => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

function AddEventModal({ onClose, onSave }){
  const [kind, setKind] = useState('win');
  const [title, setTitle] = useState('');
  const [note, setNote] = useState('');
  const [date, setDate] = useState(() => isoDate(window.TODAY));
  const [person, setPerson] = useState('you');
  const [privacy, setPrivacy] = useState('public');
  const [sharedWith, setSharedWith] = useState({ angie: true });
  const [eventId] = useState(() => 'e' + Math.random().toString(36).slice(2, 8));

  const canSave = title.trim().length > 0 && date.length === 10;

  const save = () => {
    if (!canSave) return;
    onSave({
      id: eventId,
      date, person, kind, privacy, title: title.trim(), note: note.trim(),
      sharedWith: privacy === 'shared' ? Object.keys(sharedWith).filter(k => sharedWith[k]) : [],
    });
    onClose();
  };

  return (
    <ModalShell onClose={onClose}>
      <div className="modal-body">
        <div className="small-caps" style={{marginBottom:6}}>New entry</div>
        <h2>What just happened?</h2>
        <p className="lead">A win, a loss, or somewhere between &mdash; keep it short, then a line about why.</p>

        <div className="field">
          <label>Kind</label>
          <div className="kind-pick" style={{alignSelf:'flex-start'}}>
            <button className={kind==='win' ? 'is-active' : ''} onClick={() => setKind('win')}>
              <span className="swatch" style={{'--swatch':'var(--win)'}}/> Win
            </button>
            <button className={kind==='loss' ? 'is-active' : ''} onClick={() => setKind('loss')}>
              <span className="swatch" style={{'--swatch':'var(--loss)'}}/> Loss
            </button>
          </div>
        </div>

        <div className="field">
          <label>Headline</label>
          <input
            type="text"
            placeholder={kind === 'win' ? 'e.g. Hit 100 sign-ups for the course' : 'e.g. Lost the Northstar account'}
            value={title}
            autoFocus
            onChange={e => setTitle(e.target.value)}
          />
        </div>

        <div className="field">
          <label>One line of context (optional)</label>
          <textarea
            rows={2}
            placeholder={kind === 'win' ? 'What made it happen?' : 'What\u2019s the lesson?'}
            value={note}
            onChange={e => setNote(e.target.value)}
          />
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
          <div className="field">
            <label>Date</label>
            <input type="date" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div className="field">
            <label>Whose</label>
            <div className="person-grid" style={{gridTemplateColumns:'repeat(5,1fr)'}}>
              {window.PEOPLE.map(p => (
                <button
                  key={p.id}
                  className={"person-tile " + (person === p.id ? 'is-active' : '')}
                  style={{'--tint': p.tint}}
                  onClick={() => setPerson(p.id)}
                >
                  <span className="av">{p.short}</span>
                  <span className="name">{p.name}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        <div className="field">
          <label>Privacy</label>
          <div className="priv-pick" style={{alignSelf:'flex-start'}}>
            <button className={privacy==='public' ? 'is-active' : ''} onClick={() => setPrivacy('public')}>
              <PrivacyIcon privacy="public" /> Public
            </button>
            <button className={privacy==='shared' ? 'is-active' : ''} onClick={() => setPrivacy('shared')}>
              <PrivacyIcon privacy="shared" /> Shared
            </button>
            <button className={privacy==='private' ? 'is-active' : ''} onClick={() => setPrivacy('private')}>
              <PrivacyIcon privacy="private" /> Private
            </button>
          </div>
          {privacy === 'shared' ? (
            <div style={{marginTop:10}}>
              <div className="small-caps" style={{marginBottom:6}}>Visible to</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                {window.PEOPLE.filter(p => p.id !== person).map(p => {
                  const on = !!sharedWith[p.id];
                  return (
                    <button key={p.id}
                      className={"person-chip " + (on ? '' : 'is-off')}
                      style={{'--tint': p.tint}}
                      onClick={() => setSharedWith(s => ({ ...s, [p.id]: !on }))}
                    >
                      <span className="av">{p.short}</span> {p.name}
                    </button>
                  );
                })}
              </div>
            </div>
          ) : null}
          {privacy === 'private' ? (
            <div style={{marginTop:8,fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',fontSize:13}}>
              Only you. Won&rsquo;t appear in shared views or summaries.
            </div>
          ) : null}
          {privacy === 'public' ? (
            <div style={{marginTop:8,fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',fontSize:13}}>
              Anyone you&rsquo;ve added to your circle will see this.
            </div>
          ) : null}
        </div>
      </div>

      <div className="modal-foot">
        <span className="small-caps">Esc to cancel</span>
        <div style={{display:'flex',gap:8}}>
          <button className="pill" onClick={onClose}>Cancel</button>
          <button className="pill primary" onClick={save} disabled={!canSave} style={{opacity: canSave ? 1 : 0.5}}>
            Add to timeline
          </button>
        </div>
      </div>
    </ModalShell>
  );
}

function EventDetailModal({ event, onClose, onUpdate, onDelete }){
  const ev = event;
  const d = parseDate(ev.date);
  const cls = ev.kind === 'win' ? 'chip-win' : 'chip-loss';
  const [privacy, setPrivacy] = useState(ev.privacy);
  const [sharedWith, setSharedWith] = useState(() => {
    const o = {};
    (ev.sharedWith || []).forEach(id => { o[id] = true; });
    return o;
  });

  const commitPrivacy = (next) => {
    setPrivacy(next);
    onUpdate({ ...ev, privacy: next });
  };
  const toggleShared = (pid) => {
    const nextOn = !sharedWith[pid];
    const nextMap = { ...sharedWith, [pid]: nextOn };
    setSharedWith(nextMap);
    onUpdate({ ...ev, privacy: 'shared', sharedWith: Object.keys(nextMap).filter(k => nextMap[k]) });
  };

  return (
    <ModalShell onClose={onClose} width={580}>
      <div className={cls} style={{padding:'22px 28px 8px',borderBottom:'1px solid var(--rule)',background:'linear-gradient(180deg,var(--softc),transparent 70%)'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
          <span style={{width:9,height:9,borderRadius:'50%',background:'var(--dotc)',display:'inline-block'}}/>
          <span className="small-caps" style={{color:'var(--inkc)'}}>{ev.kind}</span>
          <span style={{flex:1}}/>
          <PrivacyLabel privacy={privacy} />
        </div>
        <h2 style={{marginTop:4}}>{ev.title}</h2>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:10,marginBottom:18}}>
          <Avatar person={ev.person} size={22} />
          <span style={{fontSize:13,color:'var(--ink-2)'}}>{personById(ev.person).name}</span>
          <span style={{color:'var(--muted)'}}>·</span>
          <span style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.06em',color:'var(--ink-2)'}}>
            {fmtFull(d).toUpperCase()}
          </span>
        </div>
      </div>

      <div className="modal-body">
        {ev.image ? (
          <div style={{margin:'-4px 0 16px'}}>
            <EventImagePlaceholder event={ev} height="240px" radius={12} />
          </div>
        ) : null}
        {ev.note ? (
          <p style={{fontFamily:'var(--font-serif)',fontSize:17,lineHeight:1.5,color:'var(--ink)',margin:'4px 0 8px',textWrap:'pretty'}}>
            {ev.note}
          </p>
        ) : (
          <p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',fontSize:15}}>
            No note yet — add a line about what made this matter.
          </p>
        )}

        <div className="hr" style={{margin:'18px 0 16px'}} />

        <div className="small-caps" style={{marginBottom:10}}>Privacy</div>
        <div className="priv-pick">
          <button className={privacy==='public' ? 'is-active' : ''} onClick={() => commitPrivacy('public')}>
            <PrivacyIcon privacy="public" /> Public
          </button>
          <button className={privacy==='shared' ? 'is-active' : ''} onClick={() => commitPrivacy('shared')}>
            <PrivacyIcon privacy="shared" /> Shared
          </button>
          <button className={privacy==='private' ? 'is-active' : ''} onClick={() => commitPrivacy('private')}>
            <PrivacyIcon privacy="private" /> Private
          </button>
        </div>

        {privacy === 'shared' ? (
          <div style={{marginTop:14}}>
            <div className="small-caps" style={{marginBottom:8}}>Visible to</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {window.PEOPLE.filter(p => p.id !== ev.person).map(p => {
                const on = !!sharedWith[p.id];
                return (
                  <button key={p.id}
                    className={"person-chip " + (on ? '' : 'is-off')}
                    style={{'--tint': p.tint}}
                    onClick={() => toggleShared(p.id)}
                  >
                    <span className="av">{p.short}</span> {p.name}
                  </button>
                );
              })}
            </div>
          </div>
        ) : null}
        {privacy === 'private' ? (
          <div style={{marginTop:10,fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',fontSize:13.5}}>
            Only you. Tucked away in your private archive.
          </div>
        ) : null}
        {privacy === 'public' ? (
          <div style={{marginTop:10,fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',fontSize:13.5}}>
            Anyone in your circle can see this.
          </div>
        ) : null}
      </div>

      <div className="modal-foot">
        <button className="pill" onClick={() => { onDelete(ev); onClose(); }} style={{color:'var(--loss-ink)',borderColor:'transparent'}}>Delete</button>
        <button className="pill primary" onClick={onClose}>Done</button>
      </div>
    </ModalShell>
  );
}


// ── App ───────────────────────────────────────────────────────────────────────

function App(){
  const [view, setView] = useState('horizontal');
  const [rangeKey, setRangeKey] = useState('year');
  const [showPrivate, setShowPrivate] = useState(true);
  const [peopleSel, setPeopleSel] = useState(() => window.PEOPLE.map(p => p.id));
  const [events, setEvents] = useState(() => window.EVENTS.slice());
  const [adding, setAdding] = useState(false);
  const [openId, setOpenId] = useState(null);

  const range = useMemo(() => getRange(rangeKey, window.TODAY), [rangeKey]);
  const visiblePeople = useMemo(() => {
    const m = {};
    for (const p of window.PEOPLE) m[p.id] = peopleSel.includes(p.id);
    return m;
  }, [peopleSel]);

  const filtered = useMemo(
    () => filterEvents(events, range, visiblePeople, showPrivate),
    [events, range, visiblePeople, showPrivate]
  );

  const wins  = filtered.filter(e => e.kind === 'win').length;
  const losses = filtered.filter(e => e.kind === 'loss').length;

  const togglePerson = (pid) => {
    setPeopleSel(sel => sel.includes(pid) ? sel.filter(id => id !== pid) : [...sel, pid]);
  };

  const onSaveNew = (newEv) => setEvents(es => [...es, newEv]);
  const onUpdate = (next) => setEvents(es => es.map(e => e.id === next.id ? next : e));
  const onDelete = (ev) => setEvents(es => es.filter(e => e.id !== ev.id));

  const openEvent = events.find(e => e.id === openId) || null;

  const rangeLabel = useMemo(() => {
    if (rangeKey === 'all') return 'the full record';
    const a = fmtFullShort(range.start);
    const b = fmtFullShort(range.end);
    return `${a} \u2192 ${b}`;
  }, [rangeKey, range]);

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <span className="dot" /> Timeline
          <span className="meta">v1 · personal record</span>
        </div>

        <div className="view-switch" role="tablist">
          {[
            ['horizontal', 'Axis'],
            ['vertical',   'Journal'],
            ['grid',       'Year-in-pixels'],
          ].map(([k, label]) => (
            <button
              key={k}
              role="tab"
              className={view === k ? 'is-active' : ''}
              onClick={() => setView(k)}
            >{label}</button>
          ))}
        </div>

        <div className="top-actions">
          <span className="pill" style={{cursor:'default'}} title={`${filtered.length} entries match your filters`}>
            <span style={{width:7,height:7,borderRadius:50,background:'var(--ink)',display:'inline-block'}}/>
            {filtered.length} <span style={{color:'var(--muted)'}}>shown</span>
          </span>
          <button className="pill primary" onClick={() => setAdding(true)}>
            + Add event <span className="k" style={{borderColor:'rgba(255,255,255,0.25)',color:'rgba(255,255,255,0.7)'}}>N</span>
          </button>
        </div>
      </div>

      <div className="stage">
        <div className="range-bar">
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <span className="label">Range</span>
            <div className="seg">
              {['month','quarter','year','all'].map(k => (
                <button key={k}
                  className={rangeKey === k ? 'is-active' : ''}
                  onClick={() => setRangeKey(k)}
                >{k === 'all' ? 'All' : k[0].toUpperCase()+k.slice(1)}</button>
              ))}
            </div>
          </div>

          <div className="people-strip" style={{flex:1}}>
            <span className="label" style={{marginRight:4}}>Showing</span>
            {window.PEOPLE.map(p => {
              const on = visiblePeople[p.id];
              return (
                <button key={p.id}
                  className={"person-chip " + (on ? '' : 'is-off')}
                  style={{'--tint': p.tint}}
                  onClick={() => togglePerson(p.id)}
                  title={on ? `Hide ${p.name}` : `Show ${p.name}`}
                >
                  <span className="av">{p.short}</span> {p.name}
                </button>
              );
            })}
          </div>

          <div className="scrim">
            {rangeLabel}
            <span className="count">
              <span style={{color:'var(--win-ink)'}}>{wins} wins</span>
              <span style={{color:'var(--muted-2)',margin:'0 8px'}}>·</span>
              <span style={{color:'var(--loss-ink)'}}>{losses} losses</span>
            </span>
          </div>
        </div>

        {filtered.length === 0 ? (
          <div style={{textAlign:'center',padding:'80px 20px'}}>
            <div className="small-caps" style={{marginBottom:8}}>Nothing here yet</div>
            <div style={{fontFamily:'var(--font-serif)',fontSize:28,color:'var(--ink)',letterSpacing:'-0.005em'}}>
              No events in this window.
            </div>
            <div style={{fontFamily:'var(--font-serif)',fontStyle:'italic',color:'var(--muted)',marginTop:8}}>
              Widen the range, show more people, or add the next thing that happens.
            </div>
            <button className="pill primary" style={{marginTop:18}} onClick={() => setAdding(true)}>
              + Add the first one
            </button>
          </div>
        ) : view === 'horizontal' ? (
          <HorizontalView events={filtered} range={range} onOpenEvent={(e) => setOpenId(e.id)} />
        ) : view === 'vertical' ? (
          <VerticalView events={filtered} range={range} onOpenEvent={(e) => setOpenId(e.id)} />
        ) : (
          <GridView events={filtered} range={range} onOpenEvent={(e) => setOpenId(e.id)} />
        )}
      </div>

      {adding ? (
        <AddEventModal onClose={() => setAdding(false)} onSave={onSaveNew} />
      ) : null}
      {openEvent ? (
        <EventDetailModal
          event={openEvent}
          onClose={() => setOpenId(null)}
          onUpdate={onUpdate}
          onDelete={onDelete}
        />
      ) : null}
    </div>
  );
}

// Keyboard shortcut: N to add
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'n' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
    const btn = document.querySelector('.pill.primary');
    if (btn) btn.click();
  }
});

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
